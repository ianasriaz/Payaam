version: "3.8"

services:
  payaam-worker:
    build: .
    container_name: payaam-agent-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "src.handlers.email_worker"]

  payaam-sandbox:
    build: .
    container_name: payaam-agent-sandbox
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: ["uvicorn", "src.sandbox.app:app", "--host", "0.0.0.0", "--port", "8000"]
